<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Vortex</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo">
        <span class="logo-icon">V</span>
        <span class="logo-text">Vortex</span>
      </a>
    </div>
    <div class="nav-right">
      <a href="signup.html" class="btn btn-primary">Sign Up</a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to continue to Vortex.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="Your username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary">Log In</button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Login is a stub for now! Real auth coming soon~');
    });
  </script>
</body>
</html>
